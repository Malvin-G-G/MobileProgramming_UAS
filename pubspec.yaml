name: uas_duolingo
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  shared_preferences: ^2.5.6
  http: ^1.2.0
  sqflite: ^2.3.0
  path: ^1.9.0
  crypto: ^3.0.3
  flutter_tts: ^4.2.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  
  assets:
    - assets/image/
    - assets/sound/

flutter_app_name:
  name: "MultiLingo"

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/image/logo.png"